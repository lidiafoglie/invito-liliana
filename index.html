<title>Invito Liliana</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at center, #fce4ec 0%, #f8bbd0 40%, #f48fb1 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 340px;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sparkle {
    position: absolute;
    pointer-events: none;
    animation: sparkleAnim 1.6s ease-in-out infinite;
  }
  @keyframes sparkleAnim {
    0%   { opacity: 0; transform: scale(0.3) rotate(0deg); }
    40%  { opacity: 1; transform: scale(1.1) rotate(30deg); }
    70%  { opacity: 0.7; transform: scale(0.9) rotate(20deg); }
    100% { opacity: 0; transform: scale(0.3) rotate(60deg); }
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(219,112,147,0.6);
    animation: ringPulse 2s ease-out infinite;
  }
  @keyframes ringPulse {
    0%   { transform: scale(0.6); opacity: 0.8; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  #envelope-wrap {
    position: relative;
    width: 280px;
    height: 200px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  #envelope-wrap:hover { transform: scale(1.03); }

  #env-body {
    position: absolute;
    bottom: 0; left: 0;
    width: 280px;
    height: 180px;
    border-radius: 4px 4px 18px 18px;
    background: linear-gradient(160deg, #fff5f7 0%, #fce4ec 60%, #f8bbd0 100%);
    box-shadow: 0 12px 40px rgba(180,60,100,0.25), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  #env-body::before {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(135deg, transparent 48.5%, rgba(219,112,147,0.15) 49%, rgba(219,112,147,0.15) 51%, transparent 51.5%),
      linear-gradient(225deg, transparent 48.5%, rgba(219,112,147,0.15) 49%, rgba(219,112,147,0.15) 51%, transparent 51.5%);
    border-radius: 4px 4px 18px 18px;
  }

  #ribbon-h {
    position: absolute;
    left: 0; top: 50%;
    width: 100%; height: 18px;
    transform: translateY(-50%);
    background: linear-gradient(180deg, #f48fb1 0%, #e91e8c 50%, #f48fb1 100%);
    opacity: 0.85;
    box-shadow: 0 2px 6px rgba(180,60,120,0.3);
  }
  #ribbon-v {
    position: absolute;
    top: 0; left: 50%;
    width: 18px; height: 100%;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #f48fb1 0%, #e91e8c 50%, #f48fb1 100%);
    opacity: 0.85;
    box-shadow: 2px 0 6px rgba(180,60,120,0.3);
  }

  #bow {
    position: absolute;
    top: -38px; left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 50px;
    pointer-events: none;
    transition: opacity 0.4s, transform 0.4s;
  }

  #seal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 52px; height: 52px;
    z-index: 10;
    transition: opacity 0.4s, transform 0.4s;
  }
  #seal-circle {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f8bbd0, #c2185b);
    box-shadow: 0 3px 12px rgba(194,24,91,0.5), inset 0 1px 3px rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Great Vibes', cursive;
    font-size: 26px;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    position: relative;
  }
  #seal-circle::after {
    content: '';
    position: absolute; inset: 4px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4);
  }

  #flap {
    position: absolute;
    top: 0; left: 0;
    width: 280px; height: 100px;
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(.4,0,.2,1);
    z-index: 5;
  }
  #flap-shape {
    position: absolute;
    top: 0; left: 0;
    width: 280px; height: 100px;
    clip-path: polygon(0 0, 50% 100%, 100% 0);
    background: linear-gradient(160deg, #fff5f7 0%, #fce4ec 80%, #f8bbd0 100%);
    box-shadow: 0 4px 12px rgba(180,60,100,0.2);
  }
  #envelope-wrap.open #flap {
    transform: rotateX(-160deg);
  }
  #envelope-wrap.slide-out {
    animation: envSlideOut 0.7s 0.3s forwards ease-in;
  }
  @keyframes envSlideOut {
    to { transform: translateY(-120%) scale(0.5); opacity: 0; }
  }

  .confetto {
    position: fixed;
    top: 50%; left: 50%;
    border-radius: 2px;
    pointer-events: none;
    z-index: 999;
    animation: confettoFly var(--dur) var(--delay) forwards cubic-bezier(.25,.46,.45,.94);
  }
  @keyframes confettoFly {
    0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
  }

  #hint {
    position: absolute;
    bottom: -38px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Great Vibes', cursive;
    font-size: 16px;
    color: #ad1457;
    animation: hintPulse 2s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes hintPulse {
    0%,100% { opacity: 0.5; }
    50%     { opacity: 1; }
  }

  /* ===== INVITO IMMAGINE ===== */
  #card-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    background: rgba(244,143,177,0.15);
  }
  #card-wrap.show {
    pointer-events: all;
    opacity: 1;
  }
  #card {
    width: min(88vw, 360px);
    max-height: 92vh;
    transform: translateY(110%);
    transition: transform 1s cubic-bezier(.22,1,.36,1) 0.5s, opacity 0.8s 0.5s;
    opacity: 0;
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(180,60,100,0.5), 0 4px 20px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  #card-wrap.show #card {
    transform: translateY(0);
    opacity: 1;
  }
  #card img {
    width: 100%;
    display: block;
    border-radius: 16px;
  }

  #close-btn {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 200;
    background: rgba(255,255,255,0.92);
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(180,60,100,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    color: #c2185b;
    transition: transform 0.2s;
  }
  #close-btn:hover { transform: scale(1.12); }
  #close-btn.visible { display: flex; }
</style>

<button id="close-btn" onclick="resetScene()">✕</button>

<script>
  const sparklesContainer = document.getElementById('sparkles-container');
  const sparklePositions = [
    {x:-140,y:-60},{x:150,y:-70},{x:-160,y:20},{x:165,y:10},
    {x:-120,y:-140},{x:130,y:-130},{x:-90,y:130},{x:110,y:120},
    {x:-50,y:-160},{x:60,y:-155},{x:-165,y:90},{x:160,y:80},
    {x:0,y:-170},{x:-140,y:-100},{x:145,y:-95},
  ];
  const ringPositions = [
    {size:80},{size:130},{size:185}
  ];
  const colors = ['#f48fb1','#e91e8c','#c2185b','#fff5f7','#f8bbd0','#fff'];

  function star4(size, color) {
    return '<svg width="'+(size*2)+'" height="'+(size*2)+'" viewBox="-'+size+' -'+size+' '+(size*2)+' '+(size*2)+'"><path d="M0,-'+size+' L'+(size*0.15)+',0 L0,'+size+' L-'+(size*0.15)+',0 Z" fill="'+color+'"/><path d="M-'+size+',0 L0,'+(size*0.15)+' L'+size+',0 L0,-'+(size*0.15)+' Z" fill="'+color+'"/></svg>';
  }
  function star6(size, color) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = i * 60 * (Math.PI / 180);
      const r = i % 2 === 0 ? size : size * 0.4;
      pts.push((r*Math.sin(a)).toFixed(2)+','+((-r*Math.cos(a)).toFixed(2)));
    }
    return '<svg width="'+(size*2)+'" height="'+(size*2)+'" viewBox="-'+size+' -'+size+' '+(size*2)+' '+(size*2)+'"><polygon points="'+pts.join(' ')+'" fill="'+color+'"/></svg>';
  }

  sparklePositions.forEach((pos, i) => {
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.style.left = (170 + pos.x) + 'px';
    el.style.top  = (210 + pos.y) + 'px';
    el.style.animationDelay    = (Math.random() * 2) + 's';
    el.style.animationDuration = (1.2 + Math.random() * 1.2) + 's';
    const color = colors[i % colors.length];
    const size  = 5 + Math.floor(Math.random() * 8);
    el.innerHTML = i % 2 === 0 ? star4(size, color) : star6(size, color);
    sparklesContainer.appendChild(el);
  });

  ringPositions.forEach((rp, i) => {
    const el = document.createElement('div');
    el.className = 'ring';
    el.style.width  = rp.size + 'px';
    el.style.height = rp.size + 'px';
    el.style.left   = (170 - rp.size/2) + 'px';
    el.style.top    = (210 - rp.size/2) + 'px';
    el.style.animationDelay    = (i * 0.65) + 's';
    el.style.animationDuration = '2.2s';
    sparklesContainer.appendChild(el);
  });

  function spawnConfetti() {
    const cc = ['#f48fb1','#e91e8c','#c2185b','#ff80ab','#fff5f7','#fce4ec','#ff4081','#f8bbd0','#fff','#f06292'];
    for (let i = 0; i < 70; i++) {
      const el = document.createElement('div');
      el.className = 'confetto';
      const angle = Math.random() * 360;
      const dist  = 120 + Math.random() * 220;
      el.style.setProperty('--tx',    (Math.cos(angle*Math.PI/180)*dist)+'px');
      el.style.setProperty('--ty',    (Math.sin(angle*Math.PI/180)*dist-80)+'px');
      el.style.setProperty('--rot',   (Math.random()*720-360)+'deg');
      el.style.setProperty('--dur',   (0.6+Math.random()*0.8)+'s');
      el.style.setProperty('--delay', (Math.random()*0.2)+'s');
      const size = 5 + Math.floor(Math.random()*7);
      el.style.width      = size+'px';
      el.style.height     = size+'px';
      el.style.background = cc[Math.floor(Math.random()*cc.length)];
      if (Math.random()>0.5) el.style.borderRadius='50%';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 2000);
    }
  }

  let opened = false;
  function openEnvelope() {
    if (opened) return;
    opened = true;
    document.getElementById('hint').style.display = 'none';
    const wrap = document.getElementById('envelope-wrap');
    const seal = document.getElementById('seal');
    const bow  = document.getElementById('bow');

    wrap.classList.add('open');
    setTimeout(() => {
      seal.style.opacity   = '0';
      seal.style.transform = 'translate(-50%,-50%) scale(0.5)';
      bow.style.opacity    = '0';
      bow.style.transform  = 'translateX(-50%) scale(0.5) translateY(-10px)';
    }, 300);
    setTimeout(spawnConfetti, 500);
    setTimeout(() => wrap.classList.add('slide-out'), 700);
    setTimeout(() => {
      document.getElementById('card-wrap').classList.add('show');
      document.getElementById('close-btn').classList.add('visible');
    }, 950);
  }

  function resetScene() {
    opened = false;
    const wrap = document.getElementById('envelope-wrap');
    const seal = document.getElementById('seal');
    const bow  = document.getElementById('bow');
    document.getElementById('card-wrap').classList.remove('show');
    document.getElementById('close-btn').classList.remove('visible');
    setTimeout(() => {
      wrap.classList.remove('open','slide-out');
      seal.style.opacity   = '1';
      seal.style.transform = 'translate(-50%,-50%) scale(1)';
      bow.style.opacity    = '1';
      bow.style.transform  = 'translateX(-50%)';
      document.getElementById('hint').style.display = '';
    }, 600);
  }
</script>
</body>
